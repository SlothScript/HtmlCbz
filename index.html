<!DOCTYPE html>
<html>
	<head>
		<base target="_top">
		<title>Html-only Cbz Reader</title>
		<style>
			html, body {
			overflow-x: hidden;
			margin: 0;
			padding: 0;
			height: 100vh;
			color: white;
			background-color: rgb(0,0,0);
			font-family: Verdana, sans-serif;
			display: flex;
			flex-direction: column;
		}

		#bar {
			display: flex;
			align-items: center;
			gap: 10px;
			position: sticky;
			background: rgb(11,11,11);
			height: 35px;
			padding: 5px 10px;
		}

		#bar input {
			background: rgb(22,22,22);
			padding: 5px;
			border: none;
			width: 500px;
		}

		#bar input[type="range"] {
			accent-color: rgb(22,22,22);
			width: 200px;
		}

		#bar input[type="number"] {
			color: white;
			width: 50px;
			margin-left: 10px;
		}

		#imageContainer {
			flex-grow: 1;
			text-align: center;
			overflow: auto;
		}

		img {
			max-width: 100%;
			max-height: 100vh;
			display: block;
			margin: auto;
			padding-bottom: 5px;
		}

		#pageCounter {
			margin-left: auto;
			white-space: nowrap;
		}

		#messageContainer {
			width: 100%;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			pointer-events: none;
		}

		.message {
			font-size: 32px;
			text-shadow: 0 0 4px #000;
			pointer-events: none;
		}

		#loadingMessage {
			opacity: 0%;
			transition: opacity 0.5s ease-in-out;
		}
		</style>
	</head>	
	
	<body>
		<div id="messageContainer">
			<p class="message" id="loadingMessage">Loading... (0 / 0)</p>
		</div>
		<div id="imageContainer"></div>
		<div id="bar">
			<input type="file" id="fileInput" accept=".cbz">
			<text>Zoom:</text>
			<input type="range" id="zoomSlider" min="60" max="160" value="100">
			<input type="number" id="zoomInput" min="60" max="160" value="100" step="1">
			<text id="pageCounter">Page 0 / 0</text>
		</div>
	</body>
	
	<script>
		const imageContainer = document.getElementById('imageContainer');
		const loadingMessage = document.getElementById("loadingMessage");
		const pageCounter = document.getElementById('pageCounter');
		const zoomSlider = document.getElementById("zoomSlider");
		const zoomInput = document.getElementById("zoomInput");
		let imageOffsets = [];

		document.getElementById('fileInput').addEventListener('change', async function(event) {
			loadingMessage.textContent = `Loading... (0 / 0)`;
		
			const file = event.target.files[0];
			if (!file) return; // verify that at least one file exists
			loadingMessage.style.opacity = "1";
			
			const totalPages = await loadBook(file);
			if (totalPages == 0) {
				console.log(`'${file.name}' failed to load. Please check encoding...`);
				
				setTimeout(() => {
					loadingMessage.style.opacity = "0";
				}, 500);
			} 
			else {
				console.log(`'${file.name}' loaded with ${totalPages} pages. Happy reading! =)`);

				setTimeout(() => {
					loadingMessage.style.opacity = "0";
				}, 500);

				// Set up zooming after images are loaded
				setupZoom(totalPages);
				
				// Page counter logic
				imageContainer.addEventListener('scroll', function() {
					setPageCounter(totalPages);
				});
			}
		});


		async function loadBook(file) {
			if (typeof DecompressionStream === 'undefined') {
				alert("Your browser does not support the DecompressionStream API required to read CBZ files. Please use a newer browser (Chrome 103+, Firefox 113+, Safari 16.4+).");
				return 0;
			}
			try {
				const d = new Uint8Array(await file.arrayBuffer()), len = d.length;

				// Find the End of Central Directory record (PK\x05\x06), scanning backward.
				// A candidate is only trusted if its comment length AND central directory
				// size/offset are consistent, so image data can't cause false positives.
				let e = len - 22, eocd = -1;
				while (e >= 0) {
					if (d[e] === 0x50 && d[e+1] === 0x4b && d[e+2] === 0x05 && d[e+3] === 0x06) {
						const commentLen = d[e+20] | (d[e+21] << 8);
						const cdSize = d[e+12] | (d[e+13] << 8) | (d[e+14] << 16) | (d[e+15] << 24);
						const cdOffset = (d[e+16] | (d[e+17] << 8) | (d[e+18] << 16) | (d[e+19] << 24)) >>> 0;
						if (e + 22 + commentLen === len && cdOffset + cdSize === e) { eocd = e; break; }
					}
					e--;
				}
				if (eocd < 0) { alert("Could not load cbz file. It may be 7z encoded. Please use zip encoded cbz files only!"); return 0; }

				// ZIP64 archives are unsupported; detect them (ZIP64 EOCD locator PK\x06\x07
				// or 0xFFFF/0xFFFFFFFF sentinel values) so they fail cleanly instead of
				// parsing garbage.
				const zip64Locator = eocd >= 20 && d[eocd-20] === 0x50 && d[eocd-19] === 0x4b && d[eocd-18] === 0x06 && d[eocd-17] === 0x07;
				const num = d[eocd+10] | (d[eocd+11] << 8);
				const cdOff = (d[eocd+16] | (d[eocd+17] << 8) | (d[eocd+18] << 16) | (d[eocd+19] << 24)) >>> 0;
				if (zip64Locator || num === 0xFFFF || cdOff === 0xFFFFFFFF) {
					alert("This CBZ uses ZIP64 extensions, which are not supported yet. Please re-zip it as a standard ZIP file.");
					return 0;
				}

				// Parse the central directory, validating each entry.
				if (num > 0 && (cdOff + 46 > len || !(d[cdOff] === 0x50 && d[cdOff+1] === 0x4b && d[cdOff+2] === 0x01 && d[cdOff+3] === 0x02))) {
					alert("Could not load cbz file: the zip central directory is corrupt or missing (this may be a self-extracting or multi-part archive).");
					return 0;
				}
				const entries = [];
				let pos = cdOff;
				for (let i = 0; i < num; i++) {
					if (pos + 46 > len) break;
					if ((d[pos] | (d[pos+1] << 8) | (d[pos+2] << 16) | (d[pos+3] << 24)) !== 0x02014b50) break;
					const comp = d[pos+10] | (d[pos+11] << 8);
					const csize = (d[pos+20] | (d[pos+21] << 8) | (d[pos+22] << 16) | (d[pos+23] << 24)) >>> 0;
					const usize = (d[pos+24] | (d[pos+25] << 8) | (d[pos+26] << 16) | (d[pos+27] << 24)) >>> 0;
					const nlen = d[pos+28] | (d[pos+29] << 8);
					const elen = d[pos+30] | (d[pos+31] << 8);
					const clen = d[pos+32] | (d[pos+33] << 8);
					const loff = (d[pos+42] | (d[pos+43] << 8) | (d[pos+44] << 16) | (d[pos+45] << 24)) >>> 0;
					if (pos + 46 + nlen + elen + clen > len) break;
					let name = '';
					for (let j = 0; j < nlen; j++) name += String.fromCharCode(d[pos+46+j]);
					pos += 46 + nlen + elen + clen;
					if (csize === 0xFFFFFFFF || usize === 0xFFFFFFFF || loff === 0xFFFFFFFF) {
						alert("This CBZ uses ZIP64 extensions, which are not supported yet. Please re-zip it as a standard ZIP file.");
						return 0;
					}
					entries.push({ name, comp, csize, usize, loff });
				}
				if (entries.length !== num) {
					alert("Could not load cbz file: the zip central directory is corrupt or truncated.");
					return 0;
				}

				const imageFiles = entries.filter(entry => entry.name.match(/\.(jpg|jpeg|png|gif)$/i)).sort((a, b) => a.name < b.name ? -1 : 1);
				if (imageFiles.length === 0) {
					alert("No images (jpg, jpeg, png, or gif) were found in this CBZ file.");
					return 0;
				}
				imageContainer.innerHTML = '';
				const totalPages = imageFiles.length;
				const loadPromises = [];
				const skipped = [];
				for (let i = 0; i < imageFiles.length; i++) {
					const entry = imageFiles[i];
					loadingMessage.textContent = `Loading... (${i} / ${totalPages})`;
					if (entry.comp !== 0 && entry.comp !== 8) { skipped.push(entry.name); continue; }
					if (entry.loff + 30 > len) { skipped.push(entry.name); continue; }
					const fnlen = d[entry.loff+26] | (d[entry.loff+27] << 8);
					const exlen = d[entry.loff+28] | (d[entry.loff+29] << 8);
					const dataOff = entry.loff + 30 + fnlen + exlen;
					if (dataOff + entry.csize > len) { skipped.push(entry.name); continue; }
					const compressed = d.subarray(dataOff, dataOff + entry.csize);
					let imgData;
					try {
						if (entry.comp === 0) {
							imgData = new Blob([compressed]);
						} else {
							if (entry.usize > 268435456) { skipped.push(entry.name); continue; }
							const ds = new DecompressionStream('deflate-raw'), writer = ds.writable.getWriter();
							await writer.write(compressed);
							await writer.close();
							const reader = ds.readable.getReader(), chunks = [];
							while (true) {
								const { value, done } = await reader.read();
								if (done) break;
								chunks.push(value);
							}
							const result = new Uint8Array(entry.usize);
							let p = 0;
							for (const chunk of chunks) { result.set(chunk, p); p += chunk.length; }
							imgData = new Blob([result]);
						}
					} catch (err) {
						skipped.push(entry.name);
						continue;
					}
					const imgUrl = URL.createObjectURL(imgData);
					const img = document.createElement('img');
					const loadPromise = new Promise(resolve => {
						let settled = false;
						const done = () => { if (!settled) { settled = true; resolve(); } };
						img.onload = done;
						img.onerror = done;
						setTimeout(done, 30000); // fallback so one stuck image can't hang loading forever
					});
					img.src = imgUrl;
					imageContainer.appendChild(img);
					loadPromises.push(loadPromise);
				}
				await Promise.all(loadPromises);
				computeImageOffsets();
				if (skipped.length > 0) {
					alert(`${skipped.length} image(s) could not be loaded (unsupported compression or corrupt data): ${skipped.slice(0, 3).join(', ')}${skipped.length > 3 ? ', ...' : ''}`);
				}
				return totalPages;
			} catch (err) {
				alert("Could not load cbz file.\n\n" + err);
				return 0;
			}
		}


		function computeImageOffsets() {
			const images = document.querySelectorAll("#imageContainer img");
			imageOffsets = [];
			let cumulative = 0;
			images.forEach(img => {
				cumulative += (img.offsetHeight || 0) + 5;
				imageOffsets.push(cumulative);
			});
		}

		function setPageCounter(pageCount) {
			const scrollPosition = imageContainer.scrollTop;
			let currentPage = 1;
			for (let i = 0; i < imageOffsets.length; i++) {
				if (scrollPosition < imageOffsets[i]) {
					currentPage = i + 1;
					break;
				}
			}
			if (imageOffsets.length > 0 && scrollPosition >= imageOffsets[imageOffsets.length - 1]) {
				currentPage = pageCount;
			}
			pageCounter.textContent = `Page ${currentPage} / ${pageCount}`;
		}


		// Function to update zoom
		function updateZoom(value, pageCount) {
			// Find which page is currently at the top of the viewport
			const scrollTop = imageContainer.scrollTop;
			let targetPage = 0;
			for (let i = 0; i < imageOffsets.length; i++) {
				if (scrollTop < imageOffsets[i]) {
					targetPage = i;
					break;
				}
			}
			if (imageOffsets.length > 0 && scrollTop >= imageOffsets[imageOffsets.length - 1]) {
				targetPage = imageOffsets.length - 1;
			}

			// How far into that page we've scrolled
			const pageStart = targetPage > 0 ? imageOffsets[targetPage - 1] - 5 : 0;
			const offsetInPage = scrollTop - pageStart;

			const images = document.querySelectorAll("#imageContainer img");
			images.forEach(img => {
				img.style.maxHeight = `${value}vh`;
			});
			computeImageOffsets();

			// Restore scroll to keep the same page in view
			const newPageStart = targetPage > 0 ? imageOffsets[targetPage - 1] - 5 : 0;
			const imageHeight = imageOffsets[targetPage] - (targetPage > 0 ? imageOffsets[targetPage - 1] - 5 : 0) - 5;
			const fraction = imageHeight > 0 ? Math.min(offsetInPage, imageHeight) : 0;
			imageContainer.scrollTop = Math.min(newPageStart + fraction, imageContainer.scrollHeight - imageContainer.clientHeight);

			setPageCounter(pageCount);
		}


		function setupZoom(pageCount) {
			const images = document.querySelectorAll("#imageContainer img");
			let zoomLevel = zoomSlider.value || 100; // Default zoom level at 100%

			// Initialize with the default zoom level
			updateZoom(zoomLevel, pageCount);

			// Slider event listener
			zoomSlider.addEventListener("input", function () {
				const value = parseInt(zoomSlider.value);
				zoomInput.value = value; // Sync the input box with the slider
				updateZoom(value, pageCount);
			});

			// Input event listener
			zoomInput.addEventListener("input", function () {
				const value = parseInt(zoomInput.value);
				if (value >= 60 && value <= 160) {
					zoomSlider.value = value; // Sync the slider with the input box
					updateZoom(value, pageCount);
				} else {
					// Reset to last valid zoom level if input is out of bounds
					zoomInput.value = zoomLevel;
				}
			});
		}
	</script>
</html>
